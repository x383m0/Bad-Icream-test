<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Puck Hockey</title>
<style>
:root{--bg:#eef3f8;--fg:#14202e;--muted:#5b6b7d;--accent:#d62839;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e141b;--fg:#e8eef5;--muted:#8fa0b3;--accent:#ff5a68;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e141b;--fg:#e8eef5;--muted:#8fa0b3;--accent:#ff5a68;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;overflow:hidden;touch-action:none;user-select:none}
#hud{display:flex;gap:18px;align-items:baseline;font-weight:700;font-size:20px;letter-spacing:.04em}
#hud b{font-size:26px}
#wrap{position:relative}
canvas{display:block;cursor:crosshair;max-width:100%;border-radius:14px}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;background:rgba(10,20,35,.82);color:#fff;border-radius:14px;padding:20px;overflow:auto}
#msg h1{margin:0 0 4px;font-size:32px}
#msg p{margin:2px 0;opacity:.92;font-size:15px;line-height:1.55;max-width:560px}
#msg .k{font-weight:700;color:#ffd23f}
#msg .row{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:4px 0}
#msg button{font:inherit;font-weight:600;color:#fff;background:var(--accent);border:0;padding:10px 22px;border-radius:999px;cursor:pointer}
#msg button.ghost{background:transparent;border:1px solid rgba(255,255,255,.5)}
#msg button.on{outline:3px solid #ffd23f}
#msg button[disabled]{opacity:.35;cursor:not-allowed}
#msg input{font:700 28px system-ui,sans-serif;letter-spacing:.3em;text-align:center;text-transform:uppercase;width:7ch;padding:8px 10px;border-radius:12px;border:2px solid rgba(255,255,255,.5);background:rgba(255,255,255,.08);color:#fff;user-select:text}
#msg .code{font-size:46px;font-weight:800;letter-spacing:.25em;color:#ffd23f;margin:4px 0}
#msg .small{font-size:13px;opacity:.75}
#hint{color:var(--muted);font-size:12px;text-align:center;padding:0 10px}
</style>
</head>
<body>
<div id="hud"><span style="color:#2563eb">BLUE</span><b id="sa">0</b><span>–</span><b id="sb">0</b><span style="color:var(--accent)">RED</span></div>
<div id="wrap"><canvas id="c"></canvas><div id="msg"></div></div>
<div id="hint"></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const W=900,H=470,R=70,GL=70,GD=36,GH=100,PAD=70,CW=W+2*PAD,CH=H+2*PAD,WIN=5,hyp=Math.hypot,PI=Math.PI;
const NETS=[{mx:GL,bx:GL-GD},{mx:W-GL,bx:W-GL+GD}];
const $=id=>document.getElementById(id);
const cv=$('c'),g=cv.getContext('2d'),ui=$('msg');
cv.width=CW*2;cv.height=CH*2;
let S,puck,score=[0,0],state='menu',role='solo',cfg={size:2,gteam:1},myIdx=1,pause=0,flash='',glow=0,glowSide=0,tn=0;
let keys={},mouse={x:W/2,y:H/2,down:false,rel:false,rc:false};
let rin={ix:0,iy:0,mx:W/2,my:H/2,down:false,rel:false,rc:false,want:false,brake:false};
let peer=null,conn=null,hostOpt={size:2,gteam:1},guestPause=false;
const parts=[],trail=[],evq=[];let shake=0,hitstop=0,fxflash=0,sfxOn=true,AC=null,master=null;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const angDiff=(x,y)=>((x-y+PI*3)%(2*PI))-PI;
const turn=(a,t,r)=>a+clamp(angDiff(t,a),-r,r);
const blade=s=>{const L=28+(s.ext||0);return{x:s.x+Math.cos(s.a)*L,y:s.y+Math.sin(s.a)*L}};
const sk=()=>S.filter(s=>!s.goalie);
const near=(arr,p)=>arr.reduce((b,o)=>!b||hyp(o.x-p.x,o.y-p.y)<hyp(b.x-p.x,b.y-p.y)?o:b,null);
const r1=v=>Math.round(v*10)/10;
function fit(){const s=Math.min((innerWidth-16)/CW,(innerHeight-110)/CH,1.5);cv.style.width=CW*s+'px';cv.style.height=CH*s+'px'}
addEventListener('resize',fit);fit();

/* ---------- teams ---------- */
function mk(team,x,y,goalie,n){return{team,x,y,vx:0,vy:0,a:team?PI:0,goalie,n,ctl:null,charge:0,stun:0,cd:0,side:0,tc:25,st:100,want:false,exh:false,spr:false,poke:0,pk:0,pdone:false,ext:0,brk:false}}
function reset(){
  const n=cfg.size,p0=[[W/2-90,H/2],[W/2-170,H/2+90]],p1=[[W/2+90,H/2],[W/2+170,H/2-90]],nums=[9,17];
  S=[mk(0,GL+14,H/2,1,1)];
  for(let i=0;i<n;i++)S.push(mk(0,p0[i][0],p0[i][1],0,nums[i]));
  S.push(mk(1,W-GL-14,H/2,1,1));
  for(let i=0;i<n;i++)S.push(mk(1,p1[i][0],p1[i][1],0,nums[i]));
  const t0=S.filter(o=>o.team===0&&!o.goalie),t1=S.filter(o=>o.team===1&&!o.goalie);
  t0[0].ctl='h';
  if(role!=='solo')(cfg.gteam===0?t0[1]:t1[0]).ctl='g';
  myIdx=S.indexOf(role==='guest'?S.find(o=>o.ctl==='g'):t0[0]);
  puck={x:W/2,y:H/2,vx:0,vy:0,c:null,fxc:0};pause=90;
}
function updateHint(){
  const t=S[myIdx].team,mode=role==='solo'?'solo':'online';
  $('hint').textContent='You are '+(t?'RED, attacking left':'BLUE, attacking right')+' ('+mode+') · WASD/ZQSD move · mouse aim · click: shoot/pass · right click: jab · Space/Shift: sprint · X: brake · M: mute';
}
function startMatch(){
  score=[0,0];$('sa').textContent=$('sb').textContent=0;flash='';glow=0;parts.length=0;evq.length=0;shake=0;hitstop=0;reset();
  if(role==='guest')S.forEach(s=>s.fresh=true);
  state='play';ui.style.display='none';mouse.down=mouse.rel=mouse.rc=false;updateHint();
}

/* ---------- input ---------- */
function pos(e){const r=cv.getBoundingClientRect();mouse.x=(e.clientX-r.left)*CW/r.width-PAD;mouse.y=(e.clientY-r.top)*CH/r.height-PAD}
addEventListener('pointermove',pos);
addEventListener('pointerdown',e=>{audioInit();pos(e);if(e.button===2){mouse.rc=true;return}mouse.down=true});
addEventListener('pointerup',e=>{if(e.button===2)return;mouse.down=false;mouse.rel=true});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;audioInit();if(e.code==='KeyM')sfxOn=!sfxOn;keys[e.code]=true;if(e.code==='Space'||e.code.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>keys[e.code]=false);
ui.addEventListener('pointerdown',e=>e.stopPropagation());
function localI(){
  const ix=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),iy=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
  return{ix,iy,mx:mouse.x,my:mouse.y,down:mouse.down,rel:mouse.rel,rc:mouse.rc,want:!!(keys.Space||keys.ShiftLeft||keys.ShiftRight),brake:!!keys.KeyX};
}

/* ---------- sound & effects ---------- */
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{const C=window.AudioContext||window.webkitAudioContext;AC=new C();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination)}catch(_){AC=null}
}
function tone(f0,f1,d,type,vol){
  const t=AC.currentTime,o=AC.createOscillator(),gn=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+d);
  gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(gn);gn.connect(master);o.start(t);o.stop(t+d);
}
function noise(d,vol,fq){
  const n=(AC.sampleRate*d)|0,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=fq;
  const gn=AC.createGain();gn.gain.value=vol;s.connect(f);f.connect(gn);gn.connect(master);s.start();
}
function sfx(k,v){
  if(!AC||!sfxOn)return;v=Math.min(1,v||.5);
  try{switch(k){
    case 'shot':noise(.12,.35+.3*v,1800);tone(220,90,.12,'triangle',.1+.3*v);break;
    case 'wall':noise(.08,.1+.25*v,500);tone(120,60,.1,'sine',.25*v);break;
    case 'post':tone(1400,900,.35,'triangle',.22);tone(2100,1500,.25,'sine',.1);break;
    case 'hit':noise(.18,.5,300);tone(90,40,.2,'sine',.2+.5*v);break;
    case 'poke':noise(.07,.25,3000);break;
    case 'pick':tone(600,900,.06,'square',.05);break;
    case 'save':noise(.1,.4,900);tone(180,120,.1,'square',.1);break;
    case 'goal':tone(220,220,.9,'sawtooth',.16);tone(277,277,.9,'sawtooth',.12);tone(330,330,.9,'sawtooth',.1);noise(.6,.2,2500);break;
  }}catch(_){}
}
function burst(x,y,n,sp,c,life,r){
  for(let i=0;i<n;i++){const a=Math.random()*2*PI,s=sp*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:life*(.6+Math.random()*.6),m:life,r:r*(.6+Math.random()*.8),c})}
}
function fx(k,x,y,v){
  v=v||0;
  if(k==='shot'){burst(x,y,4+((v*8)|0),2+v*3,'255,255,255',22,2);shake=Math.max(shake,2+v*5);sfx('shot',v)}
  else if(k==='wall'){burst(x,y,5,2.5,'235,245,255',18,2);shake=Math.max(shake,Math.min(5,v*.5));sfx('wall',Math.min(1,v/12))}
  else if(k==='post'){burst(x,y,10,3.5,'255,230,140',22,2);shake=Math.max(shake,5);sfx('post',1)}
  else if(k==='hit'){burst(x,y,22,4.5,'255,255,255',28,2.5);shake=Math.max(shake,9);sfx('hit',Math.min(1,v/6))}
  else if(k==='poke'){burst(x,y,8,3,'255,255,255',16,1.8);sfx('poke',1)}
  else if(k==='pick'){sfx('pick',1)}
  else if(k==='save'){burst(x,y,10,3,'200,230,255',20,2);shake=Math.max(shake,4);sfx('save',1)}
  else if(k==='goal'){
    const nx=x?W-GL+GD/2:GL-GD/2,cl=['255,210,63','214,40,57','37,99,235','255,255,255','42,157,143'];
    for(let i=0;i<90;i++){const a=Math.random()*2*PI,s=2+Math.random()*7;parts.push({x:nx,y:H/2,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:70+Math.random()*50,m:120,r:2+Math.random()*2.5,c:cl[i%5],g:1})}
    shake=14;fxflash=1;sfx('goal',1);
  }
}
function ev(k,x,y,v){fx(k,x,y,v);if(role==='host')evq.push([k,r1(x),r1(y),r1(v||0)])}
function skateFx(){
  if(!S)return;
  for(const s of S){
    if(s.goalie)continue;
    const sp=hyp(s.vx,s.vy);
    if(s.spr&&sp>2.5&&Math.random()<.7)parts.push({x:s.x-s.vx*2.5+(Math.random()-.5)*8,y:s.y-s.vy*2.5+(Math.random()-.5)*8,vx:-s.vx*.15+(Math.random()-.5)*.8,vy:-s.vy*.15+(Math.random()-.5)*.8,l:22,m:22,r:1.6,c:'235,245,255'});
    if(s.brk&&sp>1.2)for(let k=0;k<2;k++){const n=Math.random()<.5?1:-1;parts.push({x:s.x,y:s.y,vx:-s.vy*.3*n+(Math.random()-.5),vy:s.vx*.3*n+(Math.random()-.5),l:20,m:20,r:2,c:'235,245,255'})}
  }
}
function fxUpdate(){
  skateFx();
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.94;p.vy*=.94;if(p.g)p.vy+=.12;if(--p.l<=0)parts.splice(i,1)}
  if(parts.length>700)parts.splice(0,parts.length-700);
  trail.push({x:puck.x,y:puck.y});if(trail.length>12)trail.shift();
}

/* ---------- physics ---------- */
function wall(o,r,rest){
  const qx=clamp(o.x,R,W-R),qy=clamp(o.y,R,H-R),dx=o.x-qx,dy=o.y-qy,d=hyp(dx,dy),m=R-r;
  if(d>m){const nx=dx/d,ny=dy/d;o.x=qx+nx*m;o.y=qy+ny*m;const vn=o.vx*nx+o.vy*ny;if(vn>0){o.vx-=(1+rest)*vn*nx;o.vy-=(1+rest)*vn*ny;return vn}}
  return 0;
}
function seg(o,r,rest,x1,y1,x2,y2){
  const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;let t=l2?clamp(((o.x-x1)*dx+(o.y-y1)*dy)/l2,0,1):0;
  const qx=x1+dx*t,qy=y1+dy*t,ex=o.x-qx,ey=o.y-qy,d=hyp(ex,ey);
  if(d<r){const nx=d?ex/d:1,ny=d?ey/d:0;o.x=qx+nx*r;o.y=qy+ny*r;const vn=o.vx*nx+o.vy*ny;if(vn<0){o.vx-=(1+rest)*vn*nx;o.vy-=(1+rest)*vn*ny;return -vn}}
  return 0;
}
function netHit(o,r,rest){
  const y0=H/2-GH/2,y1=H/2+GH/2,rr=r+1;let m=0;
  for(const n of NETS){m=Math.max(m,seg(o,rr,rest,n.bx,y0,n.mx,y0),seg(o,rr,rest,n.bx,y1,n.mx,y1),seg(o,rr,rest,n.bx,y0,n.bx,y1))}
  return m;
}
function move(s,ix,iy,acc,max,brk){
  if(s.stun>0){s.stun--;ix=iy=0}
  if(s.st<=0)s.exh=true;else if(s.st>25)s.exh=false;
  const has=ix*ix+iy*iy>.01;
  s.brk=!!brk&&s.stun<=0;
  s.spr=!!(s.want&&!s.exh&&!s.brk&&s.stun<=0&&has);
  s.st=s.spr?Math.max(0,s.st-.55):Math.min(100,s.st+.22);
  if(s.spr)acc*=1.6;
  if(has){ // edge grip: bleed off sideways slide so turns bite, and help when reversing
    const il=hyp(ix,iy),ux=ix/il,uy=iy/il,al=s.vx*ux+s.vy*uy,gr=s.spr?.05:.09;
    s.vx-=(s.vx-al*ux)*gr;s.vy-=(s.vy-al*uy)*gr;
    if(al<0){s.vx+=ux*acc*.5;s.vy+=uy*acc*.5}
  }
  const fr=s.brk?.9:has?.987:.972;
  s.vx=(s.vx+ix*acc)*fr;s.vy=(s.vy+iy*acc)*fr;
  const m=s.spr?5.4:max,sp=hyp(s.vx,s.vy);if(sp>m){s.vx*=m/sp;s.vy*=m/sp}
  s.x+=s.vx;s.y+=s.vy;wall(s,12,.3);netHit(s,12,.3);
}
function shoot(s,c,ang,spo){
  const p=Math.min(1,c/50);let sp=spo||5.5+p*10.5;
  if(s.ctl&&c<12){
    let best=null,bd=.45;
    for(const m of sk())if(m.team===s.team&&m!==s){const a=Math.atan2(m.y-s.y,m.x-s.x),d=Math.abs(angDiff(a,ang));if(d<bd){bd=d;best=m}}
    if(best){const t=hyp(best.x-s.x,best.y-s.y);sp=Math.min(13,4+t*.025);const k=t/sp;ang=Math.atan2(best.y+best.vy*k-s.y,best.x+best.vx*k-s.x)}
  }
  const t=blade(s);puck.c=null;puck.x=t.x;puck.y=t.y;
  puck.vx=Math.cos(ang)*sp+s.vx*.3;puck.vy=Math.sin(ang)*sp+s.vy*.3;s.charge=0;s.cd=22;
  ev('shot',t.x,t.y,Math.min(1,sp/16));
}
function poke(s){s.poke=12;s.pk=45;s.pdone=false}
function pokeHit(s){
  if(s.poke<=0||s.pdone)return;
  const b=blade(s);
  if(puck.c!==s&&hyp(b.x-puck.x,b.y-puck.y)<16){
    if(puck.c){
      if(puck.c.team===s.team)return;
      const k=puck.c;k.cd=40;k.charge=0;puck.c=null;
      puck.vx=Math.cos(s.a)*7+(Math.random()-.5)*3;puck.vy=Math.sin(s.a)*7+(Math.random()-.5)*3;s.cd=12;
    }else{puck.vx+=Math.cos(s.a)*6;puck.vy+=Math.sin(s.a)*6}
    s.pdone=true;ev('poke',puck.x,puck.y,1);
  }
}
function human(s,I){
  let ix=I.ix,iy=I.iy;const l=hyp(ix,iy);if(l){ix/=l;iy/=l}
  s.a=turn(s.a,Math.atan2(I.my-s.y,I.mx-s.x),.22);
  s.want=!!I.want;
  if(I.rc&&s.poke<=0&&s.pk<=0)poke(s);
  if(puck.c===s){if(I.down)s.charge=Math.min(50,s.charge+1);else if(s.charge>0||I.rel)shoot(s,Math.max(s.charge,1),s.a)}
  else s.charge=I.down?Math.min(30,s.charge+1):0; // wind up while chasing the puck
  move(s,ix,iy,.2,3.7,I.brake);
}
function ai(s){
  const me=s.team,att=me?GL:W-GL,dx=me?-1:1,own=me?W-GL:GL,all=sk(),mates=all.filter(o=>o.team===me&&o!==s),foes=all.filter(o=>o.team!==me),c=puck.c;
  let tx=puck.x,ty=puck.y,aim=Math.atan2(puck.y-s.y,puck.x-s.x);s.want=false;
  if(c===s){
    if(!s.side)s.side=Math.random()<.5?-1:1;
    const f=near(foes,s),fd=hyp(f.x-s.x,f.y-s.y),m=mates[0];
    tx=att;ty=H/2+s.side*60;if(fd<80)ty=s.y+(s.y<f.y?-1:1)*80;s.want=fd<110&&s.st>35;
    aim=Math.atan2(H/2+s.side*36-s.y,att-s.x);
    if(fd<48&&m&&Math.abs(att-m.x)<Math.abs(att-s.x)-30){const t=hyp(m.x-s.x,m.y-s.y);shoot(s,5,Math.atan2(m.y-s.y,m.x-s.x),Math.min(12,4+t*.025));s.side=0;return}
    if(Math.abs(att-s.x)<320&&Math.abs(s.y-H/2)<170){s.charge++;if(s.charge>s.tc){shoot(s,s.charge,aim+(Math.random()-.5)*.22);s.side=0;s.tc=18+Math.random()*22}}
    else s.charge=0;
  }else if(c&&c.team===me){
    tx=c.x+dx*140;ty=c.y<H/2?c.y+110:c.y-110;aim=Math.atan2(c.y-s.y,c.x-s.x);s.charge=0;
  }else if(c){
    s.charge=0;
    if(near(all.filter(o=>o.team===me),c)===s){tx=c.x+c.vx*8;ty=c.y+c.vy*8;s.want=hyp(s.x-c.x,s.y-c.y)<170&&s.st>25;if(hyp(s.x-c.x,s.y-c.y)<48&&s.pk<=0&&Math.random()<.05)poke(s)}
    else{tx=c.x*.55+own*.45;ty=c.y*.55+H/2*.45}
  }else{
    s.charge=0;
    if(near(all.filter(o=>o.team===me),puck)!==s){tx=puck.x+dx*100;ty=puck.y<H/2?puck.y+90:puck.y-90}else s.want=hyp(s.x-puck.x,s.y-puck.y)>110&&s.st>40;
  }
  const behind=puck.x<GL||puck.x>W-GL;
  tx=clamp(tx,behind?16:GL+16,behind?W-16:W-GL-16);ty=clamp(ty,30,H-30);
  s.a=turn(s.a,aim,.16);
  const ex=tx-s.x,ey=ty-s.y,d=hyp(ex,ey),f=Math.min(1,d/50);
  move(s,d>3?ex/d*f:0,d>3?ey/d*f:0,.15,3.3);
}
function goalie(s){
  const gx=s.team?W-GL-14:GL+14,sg=s.team?-1:1;
  const ty=clamp(H/2+(puck.y-H/2)*.6,H/2-38,H/2+38);
  let tx=gx;if(Math.abs(puck.x-gx)<200)tx=gx+sg*Math.min(24,(200-Math.abs(puck.x-gx))*.2);
  const ex=tx-s.x,ey=ty-s.y,d=hyp(ex,ey),sp=Math.min(3,d);
  if(d>.01){s.vx=ex/d*sp;s.vy=ey/d*sp}else s.vx=s.vy=0;
  s.x+=s.vx;s.y+=s.vy;s.a=sg>0?0:PI;
}
function goal(t){

function puckStep(){
  const px=puck.x,c=puck.c;puck.fxc=(puck.fxc||0)-1;
  const imp=(v,k)=>{if(v>2.5&&puck.fxc<=0){ev(k,puck.x,puck.y,v);puck.fxc=7}};
  if(c){
    const t=blade(c);puck.x+=(t.x-puck.x)*.5;puck.y+=(t.y-puck.y)*.5;puck.vx=c.vx;puck.vy=c.vy;
    for(const o of sk())if(o.team!==c.team&&o.cd<=0&&o.stun<=0){const b=blade(o);if(hyp(b.x-puck.x,b.y-puck.y)<13&&Math.random()<.07){puck.c=o;c.cd=35;o.charge=0;if(o.ctl)ev('pick',o.x,o.y,1);break}}
  }else{
    for(let j=0;j<4;j++){puck.x+=puck.vx/4;puck.y+=puck.vy/4;imp(wall(puck,7,.75),'wall');imp(netHit(puck,7,.7),'post')}
    puck.vx*=.992;puck.vy*=.992;
    const sp=hyp(puck.vx,puck.vy);if(sp>17){puck.vx*=17/sp;puck.vy*=17/sp}
    if(sp<1&&Math.abs(puck.y-H/2)<GH/2+12&&(puck.x<GL-GD+4||puck.x>W-GL+GD-4))puck.vy+=(puck.y<H/2?-1:1)*.06;
  }
  wall(puck,7,.75);netHit(puck,7,.7);
  for(const s of S)if(s.goalie){
    const dx=puck.x-s.x,dy=puck.y-s.y,d=hyp(dx,dy);
    if(d<22&&d>0){
      const nx=dx/d,ny=dy/d;
      if(puck.c){const k=puck.c;puck.c=null;k.cd=30;puck.vx=(s.team?-1:1)*6;puck.vy=ny*3}

}
function hit(a,b){

    if(puck.c===b){puck.c=null;puck.vx=a.vx*1.3+(Math.random()-.5)*3;puck.vy=a.vy*1.3+(Math.random()-.5)*3;b.cd=45}

}
function step(){
  if(glow>0)glow--;

  for(const s of S){
    s.cd--;s.pk--;if(s.poke>0)s.poke--;s.ext=s.poke>0?22*Math.sin(PI*(1-s.poke/12)):0;

function applyState(m){
  m.p.forEach((a,i)=>{
    const s=S[i];if(!s)return;
    const own=i===myIdx&&!s.fresh;
    s.tx=a[0];s.ty=a[1];s.ta=a[4];s.ext=a[8];s.charge=a[9];s.poke=a[12];
    if(own){ // own skater is predicted locally; only gently corrected by the host
      if(hyp(s.tx-s.x,s.ty-s.y)>70){s.x=s.tx;s.y=s.ty;s.vx=a[2];s.vy=a[3]}
      s.st+=(a[5]-s.st)*.15;
      if(a[7]){if(s.stun<=0)s.stun=30}else s.stun=0;
    }else{s.vx=a[2];s.vy=a[3];s.st=a[5];s.spr=!!a[6];s.stun=a[7];s.exh=!!a[10];s.brk=!!a[11]}

function smooth(){
  if(role!=='guest'||!S)return;

    if(s.tx===undefined)return;
    const dx=s.tx-s.x,dy=s.ty-s.y,d=hyp(dx,dy);
    if(i===myIdx){if(d>70){s.x=s.tx;s.y=s.ty}else{const k=d>25?.06:.02;s.x+=dx*k;s.y+=dy*k}return}
    if(d>120){s.x=s.tx;s.y=s.ty}else{s.x+=dx*.5;s.y+=dy*.5}
    s.a+=angDiff(s.ta,s.a)*.5;
  });
  if(puck.tx!==undefined){const dx=puck.tx-puck.x,dy=puck.ty-puck.y;if(hyp(dx,dy)>120){puck.x=puck.tx;puck.y=puck.ty}else{puck.x+=dx*.55;puck.y+=dy*.55}}
}
function predict(){
  const s=S&&S[myIdx];if(!s||s.fresh||guestPause)return;
  const I=localI();let ix=I.ix,iy=I.iy;const l=hyp(ix,iy);if(l){ix/=l;iy/=l}
  s.a=turn(s.a,Math.atan2(I.my-s.y,I.mx-s.x),.22);

function sendInput(){

function onData(m){
  if(!m||!m.t)return;
  if(m.t==='cfg'){cfg={size:m.size,gteam:m.gteam};role='guest';startMatch()}
  else if(m.t==='s'){if(role==='guest'&&S&&state==='play')applyState(m)}
  else if(m.t==='i'){if(role==='host'){rin.ix=m.ix;rin.iy=m.iy;rin.mx=m.mx;rin.my=m.my;rin.down=!!m.d;rin.want=!!m.w;rin.brake=!!m.b;if(m.rl)rin.rel=true;if(m.rc)rin.rc=true}}

}

  c.on('data',onData);

}
function closeNet(){try{if(conn)conn.close()}catch(_){}try{if(peer)peer.destroy()}catch(_){}conn=peer=null}

}
const CODECH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function createRoom(){
  if(!netOK())return;
  closeNet();role='host';
  const code=Array.from({length:5},()=>CODECH[Math.random()*CODECH.length|0]).join('');
  cfg={size:hostOpt.size,gteam:hostOpt.size===1?1:hostOpt.gteam};
  peer=new Peer('puckhockey-'+code);
  peer.on('open',()=>panel('<h1>Room ready</h1><p>Give this code to your friend:</p><div class="code">'+code+'</div><p>'+(cfg.size===1?'1v1':'2v2 with bots')+' · your friend plays '+(cfg.gteam===0?'on your team':'against you')+'</p><p class="small">Waiting for the other player to join…</p><div class="row"><button class="ghost" data-a="menu">Cancel</button></div>'));
  peer.on('connection',c=>{
    if(conn){c.close();return}
    conn=c;wire(c);
    c.on('open',()=>{send({t:'cfg',size:cfg.size,gteam:cfg.gteam});startMatch()});
  });
  peer.on('error',e=>{

  });
}
function setSt(t){const e=$('st');if(e)e.textContent=t}
function joinRoom(code){
  if(!netOK())return;
  if(!/^[A-HJ-NP-Z2-9]{5}$/.test(code)){setSt('Enter the 5-character room code.');return}
  closeNet();role='guest';setSt('Connecting…');
  peer=new Peer();
  peer.on('open',()=>{
    const c=peer.connect('puckhockey-'+code,{reliable:true});conn=c;wire(c);
    c.on('open',()=>setSt('Connected. Waiting for the host to start…'));
    setTimeout(()=>{if(conn===c&&!c.open)setSt('Could not reach that room. Check the code and try again.')},10000);
  });
  peer.on('error',e=>setSt(e.type==='peer-unavailable'?'No room found with that code.':'Connection error: '+e.type));
}

    a.restore();
    a.strokeStyle='#d62839';a.lineWidth=3.5;a.lineJoin='round';a.beginPath();a.moveTo(n.mx,y0);a.lineTo(n.bx,y0);a.lineTo(n.bx,y0+GH);a.lineTo(n.mx,y0+GH);a.stroke();
    for(const y of [y0,y0+GH]){a.beginPath();a.arc(n.mx,y,5,0,7);a.fillStyle='#fff';a.fill();a.strokeStyle='#d62839';a.lineWidth=3;a.stroke()}
  }
}
buildArena();

/* ---------- drawing ---------- */
function circ(x,y,r,f,s,w){g.beginPath();g.arc(x,y,r,0,7);if(f){g.fillStyle=f;g.fill()}if(s){g.lineWidth=w||2;g.strokeStyle=s;g.stroke()}}
function draw(){
  g.setTransform(2,0,0,2,0,0);
  g.fillStyle='#0b1118';g.fillRect(0,0,CW,CH);
  const sx=shake>.3?(Math.random()-.5)*shake:0,sy=shake>.3?(Math.random()-.5)*shake:0;shake*=.86;
  g.save();g.translate(sx,sy);g.drawImage(arena,0,0,CW,CH);
  g.save();g.translate(PAD,PAD);
  if(glow>0){
    const gx=glowSide?W-GL+GD/2:GL-GD/2,gr=g.createRadialGradient(gx,H/2,5,gx,H/2,160);
    gr.addColorStop(0,'rgba(255,60,70,'+(.6*glow/70)+')');gr.addColorStop(1,'rgba(255,60,70,0)');
    g.fillStyle=gr;g.fillRect(gx-170,H/2-170,340,340);
  }
  // puck trail
  const tl=trail.length;
  if(tl>3){
    const sp=hyp(trail[tl-1].x-trail[tl-3].x,trail[tl-1].y-trail[tl-3].y)/2;
    if(sp>4){g.lineCap='round';for(let i=1;i<tl;i++){g.strokeStyle='rgba(30,40,60,'+(i/tl*Math.min(.4,sp/30))+')';g.lineWidth=2+i/tl*8;g.beginPath();g.moveTo(trail[i-1].x,trail[i-1].y);g.lineTo(trail[i].x,trail[i].y);g.stroke()}}
  }
  S.forEach((s,i)=>{
    const col=s.team?'#d62839':'#2563eb',r=s.goalie?16:12;
    g.fillStyle='rgba(0,0,0,.15)';g.beginPath();g.ellipse(s.x+2,s.y+4,r,r*.8,0,0,7);g.fill();
    g.save();g.translate(s.x,s.y);g.rotate(s.a);g.lineCap='round';g.lineJoin='round';
    const e=s.ext||0;
    if(s.poke>0){g.strokeStyle='rgba(255,255,255,'+(.2+s.poke/24)+')';g.lineWidth=11;g.beginPath();g.moveTo(14,-1);g.lineTo(26+e,-1);g.stroke()}
    g.strokeStyle='#a9763f';g.lineWidth=3.2;g.beginPath();g.moveTo(5,7);g.lineTo(22+e,2);g.stroke();g.translate(e,0);
    g.strokeStyle='#1b1b1b';g.lineWidth=6;g.beginPath();g.moveTo(22,2);g.quadraticCurveTo(29,2,34,-5.5);g.stroke();
    g.strokeStyle='#d9e2ea';g.lineWidth=1.6;g.beginPath();g.moveTo(24,1);g.quadraticCurveTo(29,1.2,32.5,-4);g.stroke();
    g.restore();
    g.globalAlpha=s.stun>0?.55:1;
    g.beginPath();g.arc(s.x,s.y,r,0,7);g.fillStyle=s.goalie?(s.team?'#f08a93':'#8fb0f5'):col;g.fill();g.lineWidth=3;g.strokeStyle='#14202e';g.stroke();
    g.globalAlpha=1;
    g.fillStyle='#fff';g.font='bold 11px system-ui,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(s.n,s.x,s.y+.5);
    if(s.spr){g.beginPath();g.arc(s.x-s.vx*2,s.y-s.vy*2,r+3,0,7);g.strokeStyle='rgba(255,255,255,.65)';g.lineWidth=2;g.stroke();g.beginPath();g.arc(s.x-s.vx*4.5,s.y-s.vy*4.5,r,0,7);g.strokeStyle='rgba(255,255,255,.3)';g.stroke()}
    if(s.charge>3&&!s.goalie){const t=blade(s);circ(t.x,t.y,5+s.charge*.18,'rgba(255,210,63,'+Math.min(.5,s.charge/60+.1)+')')}
    if(i===myIdx){
      g.beginPath();g.arc(s.x,s.y,r+4,0,7);g.strokeStyle='#ffd23f';g.lineWidth=2.5;g.stroke();
      g.fillStyle='rgba(0,0,0,.35)';g.fillRect(s.x-20,s.y+22,40,5);g.fillStyle=s.exh?'#ef4444':s.st<40?'#f59e0b':'#4ade80';g.fillRect(s.x-20,s.y+22,40*s.st/100,5);
      if(s.charge>0){g.fillStyle='rgba(0,0,0,.35)';g.fillRect(s.x-20,s.y-26,40,6);g.fillStyle=s.charge<12?'#7dd3fc':'#ffd23f';g.fillRect(s.x-20,s.y-26,40*s.charge/50,6)}
    }else if(s.ctl){
      g.beginPath();g.arc(s.x,s.y,r+4,0,7);g.strokeStyle='rgba(255,255,255,.9)';g.lineWidth=1.5;g.setLineDash([4,3]);g.stroke();g.setLineDash([]);
    }
  });
  circ(puck.x+1,puck.y+2,7,'rgba(0,0,0,.2)');circ(puck.x,puck.y,7,'#111','#555',1.5);
  for(const p of parts){g.fillStyle='rgba('+p.c+','+Math.max(0,p.l/p.m)+')';g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill()}
  circ(mouse.x,mouse.y,6,null,'rgba(20,32,46,.55)',1.5);
  if(flash){g.font='bold 72px system-ui,sans-serif';g.textAlign='center';g.fillStyle='rgba(20,32,46,.85)';g.fillText(flash,W/2,H/2)}
  g.restore();
  g.restore();
  if(fxflash>.02){g.fillStyle='rgba(255,235,210,'+fxflash*.22+')';g.fillRect(0,0,CW,CH);fxflash*=.9}
}

/* ---------- main loop ---------- */
function tick(){
  if(role==='guest'){predict();if((++tn&1)===0)sendInput();return}
  if(hitstop>0)hitstop--;else step();
  if(role==='host'&&(++tn&1)===0)send(snap());
}
reset();pause=0;mainMenu();
let last=0,acc=0;
function loop(t){
  acc+=Math.min(50,t-last);last=t;
  while(acc>=1000/60){if(state==='play')tick();acc-=1000/60}
  smooth();fxUpdate();draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
